components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Provide JWT access token as `Bearer <token>` in the Authorization header.
    FrappeTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Frappe API key and secret of a user holding Grievance Dashboard Reader, sent as `token
        <api_key>:<api_secret>`. Generated on that user in the desk and checked by the platform; the gateway
        passes the header through.
  schemas:
    ApiMeta:
      type: object
      properties:
        api_version:
          type: string
          example: v1
          description: Semantic API version
        status:
          type: string
          example: current
          description: Lifecycle status
      required:
      - api_version
    StandardErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
          enum:
          - error
        message:
          type: string
          description: Human-readable error description
        exception:
          type: string
          nullable: true
          description: Exception class name
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                nullable: true
                description: Field causing the validation error
              message:
                type: string
                description: Error message for the specific field
          nullable: true
          description: Structured validation errors if applicable
        meta:
          $ref: '#/components/schemas/ApiMeta'
        request_id:
          type: string
          format: uuid
          nullable: true
          description: Tracing correlation ID
      required:
      - status
      - message
      description: Standard error envelope returned on 4xx/5xx responses
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
          description: Current page number
        page_size:
          type: integer
          example: 20
          description: Items per page
        total_count:
          type: integer
          example: 142
          description: Total matching records
        total_pages:
          type: integer
          example: 8
          description: Total pages available
        has_next:
          type: boolean
          description: True when a later page exists
        has_prev:
          type: boolean
          description: True when an earlier page exists
      required:
      - page
      - page_size
      - total_count
      - total_pages
      - has_next
      - has_prev
      description: Pagination metadata block
    HealthData:
      type: object
      properties:
        status:
          type: string
          example: healthy
        service:
          type: string
          example: oan_grievance_service
        api_version:
