        \ area subtree,\n  department, category) or directly assigned to them.\n- Grievance Admins and\
        \ System Managers see all cases.\n\nSupports multi-select values (list, JSON array, or comma-separated\
        \ string) for status,\nservice_category/category, administrative_area/location/region/zone/woreda/kebele,\n\
        grievance_type, department, and submission_channel.\n\nStatus filters use the queue cards (All,\
        \ In Progress, Require More Info, Rejected,\nResolved, Closed; officers also get Assigned). Draft\
        \ is never returned. Workflow\nstages that are not a card are reported as the card they roll up\
        \ into."
      operationId: get_api_v1_grievances
