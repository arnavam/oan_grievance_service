- name: oan-grievance-realtime-v1
  url: http://oan-grievance-websocket.internal.svc:9000
  connect_timeout: 5000
  write_timeout: 3600000
  read_timeout: 3600000
  retries: 0
  tags:
  - oan
  - grievance
  - v1
  - realtime
  plugins:
  - name: correlation-id
    config:
      header_name: X-Request-Id
      generator: uuid
      echo_downstream: true
  - name: prometheus
    config:
      status_code_metrics: true
      latency_metrics: true
      bandwidth_metrics: true
  routes:
  - name: realtime-socket-io
    paths:
    - /socket.io/
    protocols:
    - http
    - https
    strip_path: false
    preserve_host: true
    tags:
    - oan
    - grievance
    - v1
    - realtime
    - bearer
    plugins:
    - name: rate-limiting
      config:
        minute: 60
        hour: 1000
        limit_by: ip
        policy: redis
        fault_tolerant: true
        hide_client_headers: false
    - name: jwt
      config:
        claims_to_verify:
        - exp
        key_claim_name: iss
        header_names:
        - Authorization
        uri_param_names:
        - access_token
    - name: request-transformer
      config:
        remove:
          headers:
          - Cookie
        replace:
          headers:
          - Origin:https://$(headers.host)
        add:
          headers:
          - Origin:https://$(headers.host)
          - Authorization:Bearer $(query_params.access_token)
          - X-Frappe-Site-Name:${{ env "DECK_FRAPPE_SITE_NAME" }}
consumers:
- username: oan-citizen-mobile-client
  tags:
  - oan
  - grievance
  - mobile
- username: oan-backoffice-portal
  tags:
  - oan
  - grievance
  - portal
