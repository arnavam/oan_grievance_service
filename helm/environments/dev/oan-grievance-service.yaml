# Values for the oan-grievance-service chart (helm/oan-grievance-service).
# Target: the oan_dev k3s node, installed by the Jenkins stage "develop → oan_dev (helm)"
# (ci/deploy-helm-dev.sh). Release `grievance`, namespace `grievance`.
#
# Set at install, not here:
# - frappe.image.tag: the Jenkins tag `<__version__>-develop.<build>`
# - frappe.siteConfig.seed.image.tag: the same tag
# - frappe.dbHost: set below, the shared PostgreSQL of the oan-frappe-common release (namespace frappe-common)

global:
  baseDomain: development.oanstaging.com

frappe:
  image:
    # Jenkinsfile ECR_REPO `oan/oan-grievance-service/grievance-service`.
    repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/oan/oan-grievance-service/grievance-service

  # No imagePullSecrets on oan_dev: the node pulls from ECR with its IAM role (kubelet
  # ecr-credential-provider, docs/operations/oan-dev-deploy.md).

  dbHost: oan-frappe-common-db-postgresql-subchart.frappe-common.svc.cluster.local
  dbRootUser: postgres

  persistence:
    worker:
      # ReadWriteMany from the NFS server.
      storageClass: nfs-csi

  siteConfig:
    values:
      host_name: https://grievance-service.development.oanstaging.com
    # Demo data from openg2p-data oan-seed/grievance. Built and pushed alongside the service image from ci/seed.
    seed:
      enabled: true
      image:
        repository: 379220350808.dkr.ecr.ap-south-1.amazonaws.com/oan/oan-grievance-service/grievance-seed

  # The central APISIX gateway runs in another cluster and reaches gunicorn and socket.io on
  # these node ports. Allow them in the node's security group from the gateway cluster's
  # addresses only.
  gatewayAccess:
    enabled: true
    web:
      nodePort: 30800
    socket:
      enabled: true
      nodePort: 30900

  jobs:
    configure:
      # nfs-csi creates each volume directory with mode 0777 (mountPermissions), so the
      # Frappe user can write it. The upstream root `chown -R` only races with Pods that
      # write into sites/ while the jobs run, and its failure fails the job.
      fixVolume: false
    createSite:
      siteName: grievance-service.development.oanstaging.com
