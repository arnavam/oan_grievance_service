# Defaults for OAN Grievance Redressal. Everything sits under `frappe`, the values of the
# frappe chart this one depends on. Per-environment values live in
# environments/<env>/values/oan-grievance-service.yaml.
#
# Set at install, not here:
# - frappe.image.tag: the Jenkins tag `develop-<build>` (locally: `develop`)
# - frappe.dbHost: the PostgreSQL server (set in the environment file)
# Image repositories, the seed image and dbRootUser are per environment.
# Secrets the chart generates once and keeps across upgrades (templates/secrets.yaml), see `secrets` below:
# - oan-grievance-admin (key `password`): Frappe Administrator password
# - oan-grievance-jwt (key `jwt_v1.pem`): RSA private key that signs access tokens
# - oan-grievance-secret-key (key `secret_key`): the site's HMAC secret_key
# Secrets created outside Git, in the release namespace:
# - oan-frappe-common-db (key `password`): the `postgres` password, copied from the frappe-common namespace
# - oan-grievance-sentry (key `dsn`): Sentry DSN. Optional.
# - oan-grievance-seed (key `password`): password for the demo users. Optional.

# Set create=false to bring your own Secret with the same name and keys.
secrets:
  admin:
    create: true
    name: oan-grievance-admin
  secretKey:
    create: true
    name: oan-grievance-secret-key
  jwt:
    create: true
    name: oan-grievance-jwt

# ClamAV daemon for attachment scanning (templates/clamav.yaml), reached by the site at
# grievance_clamav_host. Set enabled=false to run without it: scans then retry until a scanner exists.
clamav:
  enabled: true
  image:
    repository: clamav/clamav-debian
    tag: "1.4"
    pullPolicy: IfNotPresent
  port: 3310
  resources:
    requests:
      memory: 1536Mi
    limits:
      memory: 3Gi

frappe:
  image:
    # Set per environment. package_chart.py needs both keys to exist.
    repository: ""
    tag: ""

  # PostgreSQL runs outside the cluster. The create-site job reads the password of dbRootUser
  # from Secret oan-frappe-common-db, a copy of the one the frappe-common release creates.
  dbHost: ""
  dbPort: 5432
  dbExistingSecret: oan-frappe-common-db
  dbExistingSecretPasswordKey: password
  postgresql-sts:
    enabled: false

  siteConfig:
    enabled: true
    values:
      jwt_current_kid: v1
      jwt_private_keys:
        v1: keys/jwt_v1.pem
      jwt_default_registration_role: Grievance Submitter
      jwt_self_registerable_roles:
      - Grievance Submitter
      jwt_issuer: oan-grievance
      # <release>-clamav, the Service of templates/clamav.yaml. Release `grievance` is assumed.
      grievance_clamav_host: grievance-clamav
      grievance_clamav_port: 3310
    secretValues:
      secret_key:
        secretName: oan-grievance-secret-key
        secretKey: secret_key
    files:
    # oan_auth_service refuses every login without it.
    - path: keys/jwt_v1.pem
      secretName: oan-grievance-jwt
      secretKey: jwt_v1.pem
    seed:
      userPasswordSecret:
        name: oan-grievance-seed

  # FRAPPE_STREAM_LOGGING sends frappe.logger output to stdout for the cluster log collector.
  # FRAPPE_SENTRY_DSN is optional: without the Secret, Sentry stays off.
  nginx:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  worker:
    gunicorn:
      envVars: &frappeEnv
      - name: FRAPPE_STREAM_LOGGING
        value: "1"
      - name: FRAPPE_SENTRY_DSN
        valueFrom:
          secretKeyRef:
            name: oan-grievance-sentry
            key: dsn
            optional: true
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
        targetCPU: 75
        targetMemory: 75
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    default:
      envVars: *frappeEnv
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
        targetCPU: 75
        targetMemory: 75
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    short:
      envVars: *frappeEnv
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
        targetCPU: 75
        targetMemory: 75
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    long:
      envVars: *frappeEnv
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 3
        targetCPU: 75
        targetMemory: 75
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
    scheduler:
      envVars: *frappeEnv
  socketio:
    envVars: *frappeEnv
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: 75
      targetMemory: 75
    resources:
      requests:
        cpu: 100m
        memory: 256Mi

  # The queues the app enqueues on (oan_grievance_service/services/constants.py) and their RQ timeouts
  # in seconds. The site-config job registers them in common_site_config.json.
  extraWorkers:
  - name: routing
    queues:
      grievance_routing: 300
  - name: sla
    queues:
      grievance_sla: 1800
  - name: scan
    queues:
      grievance_scan: 300
  - name: notifications
    queues:
      grievance_notifications: 600

  jobs:
    createSite:
      adminExistingSecret: oan-grievance-admin
      installApps:
      - oan_auth_service
      - oan_grievance_service

# Public base domain of the environment, used to build the hosts in iamServices. Set per environment.
global:
  baseDomain: ""

# `OAN IAM Service` rows (the login options) the site-settings Job writes into the DB on every install and
# upgrade, matched by `key`. Entries use the DocType's field names; `default_roles` is a list of role
# names. Values are templates, so hosts can follow global.baseDomain. Empty: no Job, and the rows the seed
# loaded stay as they are. Example:
#   iamServices:
#   - key: staff
#     label: Staff
#     enabled: 1
#     base_url: "https://staff-iam.{{ .Values.global.baseDomain }}"
siteSettingsJob:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  attempts: 20
iamServices: []
